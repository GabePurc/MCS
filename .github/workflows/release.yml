name: Release

# Push a tag like v0.2.0 (or run manually) to build the Windows installer and the
# macOS universal app and publish them as a GitHub release.
#
# In-app updates: the bundles are signed with the updater key (repository secrets
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD) and tauri-action uploads a
# latest.json that the app reads from releases/latest. Bump the version in package.json,
# src-tauri/tauri.conf.json and Cargo.toml, add a CHANGELOG.md section, then tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  bundle:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust_targets: ''
            args: --bundles nsis
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" 'index($0, "## [" v "]") == 1 { f = 1; next } /^## / && f { exit } f' CHANGELOG.md > notes.md
          { echo 'body<<EOF_NOTES'; cat notes.md; echo 'EOF_NOTES'; } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MCS ${{ github.ref_name }}'
          includeUpdaterJson: true
          releaseBody: |
            ## What's new
            ${{ steps.notes.outputs.body }}

            Already have MCS 0.2.0 or later? Use **Help → Check for Updates** in the app instead of downloading.

            ## Download

            | Platform | File |
            |---|---|
            | **Windows 10 / 11** (64-bit) | `MCS.Microcontroller.Simulator_*_x64-setup.exe` |
            | **macOS** 10.15+ (Apple Silicon and Intel) | `MCS.Microcontroller.Simulator_*_universal.dmg` |

            ### Windows
            1. Download and run the `..._x64-setup.exe` installer (no administrator rights needed).
            2. The installer is not code-signed yet, so Windows SmartScreen may say *"Windows protected your PC"*: click **More info → Run anyway**.
            3. If the PC lacks Microsoft Edge WebView2, the installer downloads it automatically (internet required).
            4. Start **MCS Microcontroller Simulator** from the Start menu.

            ### macOS
            1. Open the `.dmg` and drag **MCS Microcontroller Simulator** to *Applications*.
            2. The app is not notarized yet: the first time, right-click the app → **Open** → **Open** (or run `xattr -dr com.apple.quarantine "/Applications/MCS Microcontroller Simulator.app"`).

            ### Getting started
            Open an example from the Start Page (e.g. *Blink (assembly)*), press **F7** to build and **F5** to run.
            Assembly works out of the box. C programs need avr-gcc (see *Help → C Toolchain Setup* in the app).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
